services:
  - type: web
    name: ai-financial-companion
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: financial-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: financial-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: financial-db
          property: password
      - key: REDIS_URL
        fromService:
          name: financial-redis
          type: redis
          property: connectionString
      - key: APP_JWT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: update

databases:
  - name: financial-db
    databaseName: financial_companion
    user: financial_app
    plan: starter

  - name: financial-redis
    plan: starter