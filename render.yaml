services:
  - type: web
    name: ai-financial-companion
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: financial-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: financial-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: financial-db
          property: password
      - key: REDIS_URL
        fromService:
          name: financial-redis
          type: keyvalue
          property: connectionString
      - key: APP_JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: update

  - type: keyvalue
    name: financial-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  - name: financial-db
    databaseName: financial_companion
    user: financial_app
    region: singapore
    plan: free
