app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION:86400000}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: financial-companion

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/financial_companion}
    username: ${DB_USERNAME:financial_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

  # ── Redis Cache ──────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 minutes default TTL

  # ── Mail ─────────────────────────────────
mail:
  host: smtp-relay.brevo.com
  port: 587
  username: ${MAIL_USERNAME}
  password: ${MAIL_APP_PASSWORD}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
        ssl:
          enable: false

# ── Actuator (restrict in prod) ───────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.aifinance: INFO
