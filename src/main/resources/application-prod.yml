app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION:86400000}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    resend-api-url: ${RESEND_API_URL:https://api.resend.com/emails}
    from: ${MAIL_FROM:${RESEND_FROM:}}
    timeout: ${EMAIL_API_TIMEOUT:10000}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: financial-companion

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      initialization-fail-timeout: 0

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

  data:
    redis:
      url: ${REDIS_URL}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  cache:
    type: redis
    redis:
      time-to-live: 600000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.aifinance: INFO