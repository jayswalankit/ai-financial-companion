app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION:86400000}
  # Transactional email is sent through Resend's HTTPS API, not SMTP. This works
  # on Render free instances and Railway Free/Trial/Hobby plans, where SMTP is blocked.
  email:
    resend-api-key: ${RESEND_API_KEY:}
    resend-api-url: ${RESEND_API_URL:https://api.resend.com/emails}
    from: ${MAIL_FROM:${RESEND_FROM:}}
    timeout: ${EMAIL_API_TIMEOUT:10000}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: financial-companion

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/financial_companion}
    username: ${DB_USERNAME:financial_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

  # ── Redis Cache ──────────────────────────
  data:
    redis:
      # Render and Railway provide a redis:// connection string. Without this,
      # the configured REDIS_URL is ignored and the app tries localhost.
      url: ${REDIS_URL}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 minutes default TTL


# ── Actuator (restrict in prod) ───────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.aifinance: INFO
